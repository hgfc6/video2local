[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video2local"
version = "0.1.0"
description = "Desktop tool for syncing online video sources to local folders"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.46",
  "PySide6>=6.7",
  "yt-dlp>=2026.7.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
